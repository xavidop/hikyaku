{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hikyaku.fullname" . }}
  labels:
    {{- include "hikyaku.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
spec:
  podSelector:
    matchLabels:
      {{- include "hikyaku.relaySelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.extraPorts }}
    # The source ports.
    - ports:
        {{- range .Values.extraPorts }}
        - port: {{ int .port }}
          protocol: {{ .protocol | default "TCP" }}
        {{- end }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    # The admin API: kubelet probes, Prometheus, helm test.
    - ports:
        - port: {{ int .Values.adminPort }}
          protocol: TCP
      {{- with .Values.networkPolicy.adminFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    # Destinations, models and stores can be anywhere: allow all egress.
    - {}
    {{- end }}
{{- end }}
