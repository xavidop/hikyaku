{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hikyaku.secretName" . }}
  labels:
    {{- include "hikyaku.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
type: Opaque
data:
  {{- range $name, $value := .Values.secrets.create }}
  {{ $name | quote }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
