{{- /*
With persistence, each replica keeps its file DLQ and (later) its disk buffer
on its own PersistentVolumeClaim at /var/lib/hikyaku.
*/ -}}
{{- if .Values.persistence.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hikyaku.fullname" . }}
  labels:
    {{- include "hikyaku.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ int .Values.replicaCount }}
  {{- end }}
  serviceName: {{ include "hikyaku.componentName" (dict "root" . "suffix" "headless") }}
  # Replicas do not depend on each other: start and stop them all at once.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  {{- with .Values.persistence.retentionPolicy }}
  persistentVolumeClaimRetentionPolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hikyaku.relaySelectorLabels" . | nindent 6 }}
  template:
    {{- include "hikyaku.podTemplate" . | nindent 4 }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        # Selector labels only: volumeClaimTemplates cannot change after
        # creation, and the chart and app versions do.
        labels:
          {{- include "hikyaku.relaySelectorLabels" . | nindent 10 }}
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ if eq . "-" }}""{{ else }}{{ . | quote }}{{ end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
{{- end }}
