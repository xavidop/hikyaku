{{- if .Values.prompts }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hikyaku.componentName" (dict "root" . "suffix" "prompts") }}
  labels:
    {{- include "hikyaku.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
data:
  {{- range $file, $content := .Values.prompts }}
  {{ $file | quote }}: {{ $content | toString | quote }}
  {{- end }}
{{- end }}
