<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="hikyaku"><title>hikyaku 飛脚</title><g transform="translate(0 0) scale(1.0)"><rect x="2" y="2" width="252" height="252" rx="55" fill="#F5EBDD" stroke="#E6D5BF" stroke-width="4"/><g transform="translate(12 0)">
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- speed lines: the running courier -->
    <g stroke="#4A3B35" stroke-width="8" opacity="0.3">
      <line x1="30" y1="104" x2="46" y2="104"/>
      <line x1="20" y1="128" x2="42" y2="128"/>
      <line x1="30" y1="152" x2="46" y2="152"/>
    </g>
    <!-- trunk + fan-out branches -->
    <g stroke="#D9825B" stroke-width="12">
      <line x1="86" y1="128" x2="128" y2="128"/>
      <path d="M128 128 C 160 128, 158 78, 192 78"/>
      <line x1="128" y1="128" x2="198" y2="128"/>
      <path d="M128 128 C 160 128, 158 178, 192 178"/>
    </g>
    <!-- delivery chevrons -->
    <g stroke="#D9825B" stroke-width="12">
      <polyline points="186,64 204,78 186,92"/>
      <polyline points="192,114 210,128 192,142"/>
      <polyline points="186,164 204,178 186,192"/>
    </g>
  </g>
  <!-- source endpoint -->
  <circle cx="70" cy="128" r="16" fill="#8FAE8B"/>
  <!-- AI router spark at the fork -->
  <circle cx="128" cy="128" r="22" fill="#F5EBDD"/>
  <path d="M128 106 Q131.5 124.5 150 128 Q131.5 131.5 128 150 Q124.5 131.5 106 128 Q124.5 124.5 128 106 Z" fill="#F2B84B"/>
</g></g></svg>
