# golangci-lint v2 configuration (shared by every module in the monorepo; each
# module dir walks up to this file). Keep this in sync with the version pinned in
# .github/workflows/ci.yml.
version: "2"

run:
  # cmd/hikyaku pulls in Genkit and every protocol module; loading it on a cold CI
  # cache takes longer than 5m.
  timeout: 15m
  # Two runs at once (worktrees, parallel make targets) wait for each other
  # instead of failing with "parallel golangci-lint is running".
  allow-serial-runners: true

linters:
  # The standard set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard

issues:
  # Report every finding so CI shows all issues. golangci-lint otherwise truncates
  # silently (50 per linter, 3 of the same issue). Zero means no limit.
  max-issues-per-linter: 0
  max-same-issues: 0
